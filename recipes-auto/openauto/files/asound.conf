# This head unit's USB audio dongle (Realtek 0bda:49f6) exposes two
# separate analog outputs on its playback devices: hw:0,0 routes to a
# "Headset" terminal whose jack turned out to have a failing/marginal
# connector on this unit (confirmed with raw ALSA test tones -- silent
# on hw:0,0 with both a speaker and headphones, audible on hw:0,2 with
# both), while hw:0,2 routes to a plain "Headphones" terminal that
# works. Point ALSA's default device at hw:0,2 instead.
#
# openauto opens three concurrent RtAudio/ALSA streams (MEDIA_AUDIO,
# SPEECH_AUDIO, SYSTEM_AUDIO), all via RtAudio's getDefaultOutputDevice()
# -> ALSA "default". A single-client "type plug" pointed straight at
# hw:0,2 only allows one of the three to actually open the device --
# the other two fail with "won't open for output", which cascades into
# an AA protocol channel error and tears down the whole session a few
# seconds later. dmix is required so all three can share the device by
# software-mixing into one hardware stream, matching how the vanilla
# ALSA default (dmix over hw:0,0) behaved before this override, just
# pointed at the jack that actually works.
#
# dmix's own concurrent cold-start attach (three RtAudio streams all
# opening "dmixer" within milliseconds of each other on every AA
# session connect) can leave the shared hardware ring buffer's write
# pointer permanently stuck, producing silent-but-"RUNNING" playback
# with no error anywhere -- see the dmix pre-warm step in
# openauto-start.sh, which keeps this slave already initialized by a
# stable owner before autoapp ever opens it.
pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0,2"
        rate 48000
        format S16_LE
        channels 2
    }
}

pcm.!default {
    type plug
    slave.pcm "dmixer"
}

ctl.!default {
    type hw
    card 0
}
