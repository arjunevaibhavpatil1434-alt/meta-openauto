# openauto reads this from its own current working directory (autoapp
# is launched with cwd=/home/root, see openauto-start.sh/openauto.init),
# not from a fixed absolute path -- hence why this is installed there
# rather than under /etc.
#
# The real panel is a Waveshare "7inch HDMI LCD (C)" (WS170120), native
# resolution 1024x600 -- but this board's VOP/HDMI output cannot be
# made to establish that resolution by any means tried:
#   - standard CVT (49MHz) and reduced-blanking CVT (43.75MHz)
#     modelines handed directly to Qt's eglfs_kms atomic modeset were
#     both rejected outright (every CRTC left disabled)
#   - forcing the kernel's own fbcon to it via "video=" cmdline (with
#     and without the 'M' CVT flag) and having Qt inherit whatever
#     that established via "mode": "current" also failed -- "current"
#     itself proved unreliable on this hardware regardless of the
#     underlying resolution (intermittent "No modes available for
#     output" from Qt, i.e. no mode was actually active on the CRTC at
#     the moment autoapp queried it -- likely a console-blanking race)
#
# The only configuration that's actually verified stable (CRTC active,
# autoapp running without crash-looping, confirmed via
# /sys/kernel/debug/dri/*/state showing a non-empty mode "allocated by
# autoapp") is an explicit, non-"current" _720p (1280x720) modeline --
# see eglfs_kms.json and tinker-board-openauto.wks. 1280x720 is used
# instead of the panel's native size because it's the closest-aspect
# real CEA-861 timing this VOP does accept, letting the panel's own
# onboard scaler chip do a single clean ~0.8x downscale to its
# physical 1024x600 in both dimensions.
#
# Resolution here matches that actual scanout resolution (_720p)
# rather than the panel's native size, so AA's video is decoded at
# exactly 1280x720 and Qt's video widget (setFullScreen +
# IgnoreAspectRatio) maps it 1:1 with no internal stretching of its
# own -- only the panel's single downscale happens, not a compounded
# Qt-side stretch on top of it.
#
# InputDevice's touch/mouse coordinate mapping
# (ServiceFactory::createInputService) scales from the real screen
# geometry to this configured AA video geometry, so touch coordinates
# come out correct as long as this matches the actual scanout
# resolution (which it does).
#
# ScreenDPI is sent to the phone as-is (VideoService/VideoConfig) so it
# scales its rendered UI to the physical panel; a 7" diagonal at the
# panel's true 1024x600 (diagonal ~1186.8px) is ~170 DPI regardless of
# what resolution is actually being scanned out over HDMI.
[General]
ShowClock=true
HandednessOfTrafficType=0

[Video]
FPS=2
Resolution=2
ScreenDPI=170
OMXLayerIndex=1
# MarginWidth is load-bearing, confirmed by direct testing: setting it to
# 0 broke touch almost completely (pinch-zoom, a relative gesture, still
# worked; absolute-position taps didn't). 256 == 1280-1024, i.e. this
# board's forced 1280-wide HDMI scanout minus the panel's real 1024
# native width -- AA appears to use this to keep its own UI within a
# safe interior area matching the touch surface InputService declares
# (see ServiceFactory.cpp / touch_screen_config). Do not set this to 0.
# MarginHeight was tried at 120 (mirroring MarginWidth's 1280-256=1024
# logic: 720-120=600) and also broke touch alignment -- left at 0 since
# no working non-zero value has been found. If retried, first re-verify
# against InputDevice's current raw-passthrough touch model (see its
# AUTOAPP_TOUCH_OFFSET_X/Y support and openauto-start.sh) -- the MarginHeight
# experiment was run against an older, since-replaced touch-scaling
# implementation, so its failure may not carry over unchanged.
MarginWidth=256
MarginHeight=0

[Audio]
MusicAudioChannelEnabled=true
SpeechAudioChannelEnabled=true
OutputBackendType=0

[Input]
EnableTouchscreen=true
