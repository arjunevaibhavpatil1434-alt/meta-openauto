# openauto reads this from its own current working directory (autoapp
# is launched with cwd=/home/root, see openauto-start.sh/openauto.init),
# not from a fixed absolute path -- hence why this is installed there
# rather than under /etc.
#
# Video.Resolution defaults to _480p (800x480) upstream, but this
# board's actual display is 1280x720 (see eglfs_kms.json / the
# "video=HDMI-A-1:1280x720@60" kernel cmdline arg). Left at the
# default, every AA video frame is decoded at 480p and then upscaled to
# fill the real 720p screen, and -- more importantly -- InputDevice's
# touch/mouse coordinate mapping (ServiceFactory::createInputService)
# scales from the real screen geometry to this configured AA video
# geometry, so a resolution mismatch here also means wrong touch
# coordinates once a touchscreen is attached. Setting it to _720p (2)
# matches the real panel exactly.
[General]
ShowClock=true
HandednessOfTrafficType=0

[Video]
FPS=2
Resolution=2
ScreenDPI=140
OMXLayerIndex=1
MarginWidth=0
MarginHeight=0

[Audio]
MusicAudioChannelEnabled=true
SpeechAudioChannelEnabled=true
OutputBackendType=0

[Input]
EnableTouchscreen=true
