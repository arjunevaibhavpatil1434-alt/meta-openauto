# Wired AndroidAuto (USB AOAP host mode, aasdk/libusb) + wireless/Bluetooth
# via a USB WiFi+Bluetooth combo dongle (Realtek RTL8188/RTL8723 family).
#
# multi_v7_defconfig already carries most of this as modules on some
# kernel versions but not reliably all of it (RTL8XXXU_UNTESTED in
# particular gates the RTL8188EU/RTL8723 chip IDs and defaults to off),
# so pin it explicitly rather than hope the base defconfig has it.

# USB host stack (Tinker Board has 4x USB2.0 host ports; used for wired
# AA AOAP as well as for the WiFi/BT dongle)
CONFIG_USB=y
CONFIG_USB_ANNOUNCE_NEW_DEVICES=y

# 802.11 stack + Realtek USB combo driver (covers RTL8188CU/EU/RU,
# RTL8192CU/EU, RTL8723AU/BU)
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y

# Bluetooth core + generic USB HCI (RTL8723BU/DU's Bluetooth side
# enumerates as a standard USB HCI handled by btusb + Realtek firmware
# loading support)
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_RFCOMM=m
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=m
CONFIG_BT_HIDP=m
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIBTUSB_RTL=y
