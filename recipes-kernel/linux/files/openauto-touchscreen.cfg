# Touch input readiness for the head unit display.
#
# No touch hardware is attached yet, but when one is, the overwhelming
# majority of cheap plug-and-play USB touch panels/overlays (the kind
# sold as "7-10 inch HDMI+USB touch display for Raspberry Pi/car PC")
# identify as HID-multitouch devices. hid-generic/usbhid alone (already
# builtin) enumerate the device but don't parse its multitouch reports
# correctly -- CONFIG_HID_MULTITOUCH is the piece that was missing.
#
# openauto's InputDevice (src/autoapp/Projection/InputDevice.cpp) reads
# Qt-synthesized mouse events, not raw evdev, so once the kernel exposes
# a working touch device and Qt's eglfs evdev/libinput backend picks it
# up, no further openauto-side change is needed -- coordinate mapping
# already derives from QGuiApplication::primaryScreen()->geometry() and
# the configured AA video resolution (see ServiceFactory::createInputService).

CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_HID_MULTITOUCH=m

# I2C-bus touch panels (wired directly to the board rather than over USB)
# use the same HID-multitouch report parsing via an I2C-HID transport.
CONFIG_I2C_HID=m

# Common discrete I2C capacitive touch controllers found on car-PC/SBC
# display modules, in case the panel isn't HID-compliant. Built as
# modules so an unused driver costs nothing at runtime; mirrors the
# defensive multi-chip-variant style already used in
# openauto-connectivity.cfg for the WiFi/BT dongle.
CONFIG_TOUCHSCREEN_GOODIX=m
CONFIG_TOUCHSCREEN_EDT_FT5X06=m
CONFIG_TOUCHSCREEN_SILEAD=m
